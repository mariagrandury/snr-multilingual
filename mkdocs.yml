site_name: SNR Multilingual
site_description: Signal-Aware Framework for Multilingual LM Evaluation
site_url: https://snr-multilingual.netlify.app/
repo_url: https://github.com/swiss-ai/snr-multilingual
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Pretraining:
      - Overview: pretraining.md
      - Conversion: pretraining/conversion.md
      - Azure: pretraining/azure.md
  - Evaluation:
      - Overview: evaluation/index.md
      - Signal-to-Ratio Configs: evaluation/configs.md
  - Signal & Noise:
      - Overview: signal-noise/index.md
      - "RQ0 · Curves & above-random gate": signal-noise/acc_vs_flops.md
      - "RQ1 · Decision accuracy": signal-noise/decision_accuracy.md
      - "RQ2 · SNR definition": signal-noise/snr-definition.md
      - "RQ3 · AllenAI comparison": signal-noise/allenai_comparison.md
      - "RQ4 · Subtask subsets": signal-noise/smooth_subtasks.md
      - "RQ5 · Benchmark creation": signal-noise/benchmark_creation.md
      - "RQ6 · Proxy predictivity": signal-noise/proxy_predictivity.md
  - Documents: documents.md
  - Slides: /slides/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search

hooks:
  - mkdocs_hooks.py

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
