site_name: SNR Multilingual
site_description: Signal-Aware Framework for Multilingual LM Evaluation
site_url: https://snr-multilingual.netlify.app/
repo_url: https://github.com/mariagrandury/snr-multilingual
docs_dir: docs
site_dir: site
exclude_docs: |
  CLAUDE.md

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Pretraining:
      - Overview: pretraining.md
      - Conversion: pretraining/conversion.md
      - Azure: pretraining/azure.md
  - Evaluation:
      - Overview: evaluation/index.md
      - Signal-to-Ratio Configs: evaluation/configs.md
  - Signal & Noise:
      - Overview: signal-noise/index.md
      - Analysis: signal-noise/analysis.md
      - "RQ0 · Gate & curves": signal-noise/gate_and_curves.md
      - "RQ0 · Task reformulation": signal-noise/task_reformulation.md
      - "RQ1 · Scaling predictability": signal-noise/scaling_predictability.md
      - "RQ2 · Decision accuracy": signal-noise/decision_accuracy.md
      - "RQ3 · Noise & SNR": signal-noise/noise_and_snr.md
      - "RQ4 · Surrogates": signal-noise/surrogates.md
      - "RQ5 · Design decisions": signal-noise/design_decisions.md
      - "RQ6 · Language transfer": signal-noise/language_transfer.md
      - "RQ7 · External frameworks": signal-noise/external_frameworks.md
      - "RQ8 · Subset selection": signal-noise/subset_selection.md
      - "RQ9 · Benchmark design": signal-noise/benchmark_design.md
  - Documents: documents.md
  - Slides: /slides/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search

hooks:
  - mkdocs_hooks.py

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
