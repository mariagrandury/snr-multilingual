task: bbh_cloze_boolean_expressions
dataset_path: SaylorTwift/bbh
dataset_name: boolean_expressions
test_split: test
output_type: multiple_choice
num_fewshot: 0
doc_to_text: '{{input}}

  Answer:'
doc_to_choice:
- 'False'
- 'True'
doc_to_target: '{{["False", "True"].index(target.strip())}}'
metric_list:
- metric: acc
  aggregation: mean
  higher_is_better: true
- metric: acc_norm
  aggregation: mean
  higher_is_better: true
metadata:
  version: 0.0
