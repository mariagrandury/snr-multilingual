image = "jfrog.svc.cscs.ch/docker-group-csstaff/alps-images/ngc-pytorch:25.12-py3-alps1"

# /iopsstor/ whole, not per-$USER: see env_vllm.toml -- HF_HOME and LOGS_ROOT
# live under mariagrandury's scratch and are invisible to other users otherwise.
mounts = [
    "/users/${USER}",
    "/capstor/scratch/cscs/${USER}",
    "/iopsstor/",
    "/capstor/store/cscs/swissai/infra01",
    "/capstor/store/cscs/swissai/infra01/containers/nemo_container_extra_files/ofi_plugin/libnccl-net.so.v1.17.2-cuda.so:/opt/hpcx/nccl_rdma_sharp_plugin/lib/libnccl-net.so"
]

writable = true

[env]
PMIX_MCA_psec="native"

[annotations]
com.hooks.cxi.enabled="false"