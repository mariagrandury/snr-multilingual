$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: apertus-azure
display_name: train-pilot
description: >
  Pilot pretrain of the guide cell (175M, mix 30/70, seed 28) on ~5.16B tokens
  (2500 iters). ~5-8h / ~$100 on 4x A100. Resubmitting the same job resumes
  from the latest checkpoint (fixed output paths + --load).
code: ..
command: bash train.sh
environment: azureml:apertus-nemo@latest
compute: azureml:gpu-train
resources:
  shm_size: 64g
inputs:
  data:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/tokenized/mix_30_70/pilot
    mode: download   # copy .bin/.idx to node NVMe — memmap over blobfuse is pathological
outputs:
  checkpoints:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/runs/apertus-175M-fwEdu30-fw270-seed28-pilot/checkpoints
    mode: rw_mount
  logs:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/runs/apertus-175M-fwEdu30-fw270-seed28-pilot/logs
    mode: rw_mount
  cache:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/runs/apertus-175M-fwEdu30-fw270-seed28-pilot/cache
    mode: rw_mount
environment_variables:
  TRAINING_STEPS: "2500"    # x 504 x 4096 tokens = 5.16B
  LR_WARMUP_ITERS: "100"
  LR_WSD_DECAY_ITERS: "500"
  SAVE_INTERVAL: "500"
  DATA_DIR: ${{inputs.data}}
  CKPT_DIR: ${{outputs.checkpoints}}
  LOG_DIR: ${{outputs.logs}}
  CACHE_DIR: ${{outputs.cache}}
