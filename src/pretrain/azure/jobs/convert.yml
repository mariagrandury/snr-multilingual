$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: apertus-azure
display_name: convert-175M-iter50000
description: >
  Convert one Megatron torch_dist checkpoint to a HuggingFace snapshot
  (ApertusForCausalLM). ~few minutes on 1 GPU. For other cells/iters override
  inputs.checkpoints.path, outputs.hf_model.path and CKPT_STEP with --set.
code: ..
command: bash convert.sh
environment: azureml:apertus-nemo@latest
compute: azureml:gpu-nc80-lp
resources:
  shm_size: 16g
inputs:
  checkpoints:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/runs/apertus-175M-fwEdu30-fw270-seed28/checkpoints
    mode: download   # torch_dist shard loading needs fast random access
outputs:
  hf_model:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/models/apertus-175M-fwEdu30-fw270-seed28/iter_0050000
    mode: rw_mount
environment_variables:
  CKPT_STEP: "50000"
  CKPT_ROOT: ${{inputs.checkpoints}}
  HF_OUT: ${{outputs.hf_model}}
