$schema: https://azuremlschemas.azureedge.net/latest/commandJob.schema.json
type: command
experiment_name: apertus-azure
display_name: prep-data-pilot
description: Download + tokenize the FineWeb-Edu / FineWeb2-HQ mixture (pilot scale).
code: ..
command: >-
  source get_megatron.sh &&
  pip install --no-cache-dir -q datasets requests &&
  python prepare_data.py
  --output ${{outputs.tokenized}}
  --total-tokens-b $TOTAL_TOKENS_B
  --edu-ratio $EDU_RATIO
  --edu-config $EDU_CONFIG
  --workers $(nproc)
environment: azureml:apertus-nemo@latest
compute: azureml:gpu-train
outputs:
  tokenized:
    type: uri_folder
    path: azureml://datastores/workspaceblobstore/paths/tokenized/mix_30_70/pilot
    mode: rw_mount
environment_variables:
  TOTAL_TOKENS_B: "5.16"     # pilot: 2500 iters x 2,064,384 tokens/iter
  EDU_RATIO: "0.3"           # 30% FineWeb-Edu / 70% FineWeb2-HQ
  EDU_CONFIG: sample-100BT   # full run needs sample-350BT
# Full-scale variant (~415GB, several hours):
#   az ml job create -f jobs/prep.yml $AZ_ML_ARGS \
#     --set display_name=prep-data-full \
#           environment_variables.TOTAL_TOKENS_B=103.2 \
#           environment_variables.EDU_CONFIG=sample-350BT \
#           outputs.tokenized.path=azureml://datastores/workspaceblobstore/paths/tokenized/mix_30_70/full
